# m17-bridge – samostatný APRS bridge
#
# Name je zároveň APRS volací znak a používá se pro výpočet APRS-IS passcode.
# Musí to být tvůj licencovaný znak.
[General]
Name=OK1LBC
ListenAddress=0.0.0.0
ListenPort=17000
# A = APRS modul; další moduly (D = Discord, I = IRC) nejsou v této konfiguraci.
Modules=A

[Log]
Level=INFO
# Prázdné Path/Root = loguje se do systemd journalu.
Path=
Root=

[Module-A]
Type=APRS
# Evropský APRS-IS server.
Server=euro.aprs2.net
Symbol=//
