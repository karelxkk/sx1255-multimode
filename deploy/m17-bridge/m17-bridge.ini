# m17-bridge – samostatný APRS bridge
#
# Name je zároveň APRS volací znak a používá se pro výpočet APRS-IS passcode.
# Musí to být tvůj licencovaný znak.
[General]
Name=OK1LBC
ListenAddress=0.0.0.0
ListenPort=17001
# A = APRS modul; další moduly (D = Discord, I = IRC) nejsou v této konfiguraci.
Modules=A

[Log]
Level=INFO
# Prázdné Path/Root = loguje se do systemd journalu.
Path=
Root=

# Webový dashboard: seznam odeslaných/přijatých zpráv a formulář pro odeslání
# SMS na RF. Prázdné ListenAddress = dashboard je vypnutý.
# Pozor: rozhraní není chráněné heslem, poslouchej ho jen v LAN.
[Web]
ListenAddress=0.0.0.0
ListenPort=17080
# Zdrojový znak zpráv odeslaných z webu (musí to být licencovaný znak).
DefaultSource=OK1LBC
# Historie zpráv: kolik jich držet v paměti a kam je přidávat (JSONL).
MaxMessages=500
StorePath=/var/lib/m17-bridge/messages.jsonl
# Maximální délka textu zprávy (APRS zpráva má limit 67 znaků).
MaxTextLength=67
# Minimální odstup mezi dvěma zprávami z webu v sekundách.
MinSendInterval=2

[Module-A]
Type=APRS
# APRS volací znak pro tuto APRS-IS session.
Callsign=OK1LBC
# Evropský APRS-IS server.
Server=euro.aprs2.net
Symbol=//
